name = "item-location-ai-scan"
main = "src/index.ts"
compatibility_date = "2025-04-01"

[[services]]
binding = "AI"
service = "ai"

# KV Namespace for recent scan log
[[kv_namespaces]]
binding = "SCAN_KV"
id = ""  # ← Create via: wrangler kv:namespace create "SCAN_KV"
preview_id = ""

# D1 Database for persistent scan storage
[[d1_databases]]
binding = "SCAN_DB"
database_name = "item-scans"
database_id = ""  # ← Create via: wrangler d1 create item-scans
preview_database_id = ""
